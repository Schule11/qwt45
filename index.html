<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haushaltsbuch</title>
  <meta name="description" content="Tägliche Einnahmen und Ausgaben erfassen, Monat und Jahr im Blick – und die Überstunden dazu.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <!-- iPhone: als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Haushalt">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Gewählte Darstellung (hell/dunkel) sofort anwenden, ohne Aufflackern.
    // Schlüssel mit App-Kennung (siehe js/config.js), weil sich alle Apps unter
    // schule11.github.io denselben localStorage teilen.
    try { var t = localStorage.getItem('haushaltsbuch.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" tabindex="-1">
    <p class="loading">Wird geladen …</p>
  </main>

  <!-- Schwebende Menüleiste (Liquid Glass) mit "+" daneben -->
  <div class="dock">
    <nav id="tabs" aria-label="Hauptbereiche">
      <a href="#/uebersicht" data-route="uebersicht">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Übersicht</span>
      </a>
      <a href="#/finanzen" data-route="finanzen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        <span>Finanzen</span>
      </a>
      <a href="#/stunden" data-route="stunden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Stunden</span>
      </a>
    </nav>
    <button id="fab" type="button" aria-label="Neue Buchung">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <noscript>
    <p style="padding:24px">Diese App braucht JavaScript. Bitte im Browser aktivieren.</p>
  </noscript>
</body>
</html>
