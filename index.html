<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hundeschule</title>
  <meta name="description" content="Einnahmen und Ausgaben der Hundeschule erfassen – für die Anlage EÜR.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <!-- iPhone: als App vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hundeschule">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Gewählte Darstellung (hell/dunkel) sofort anwenden, ohne Aufflackern
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" tabindex="-1">
    <p class="loading">Wird geladen …</p>
  </main>

  <!-- Schwebende Menüleiste (Liquid Glass) mit "+" daneben -->
  <div class="dock">
    <nav id="tabs" aria-label="Hauptbereiche">
      <a href="#/uebersicht" data-route="uebersicht">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Übersicht</span>
      </a>
      <a href="#/buchungen" data-route="buchungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg>
        <span>Buchungen</span>
      </a>
      <a href="#/auswertung" data-route="auswertung">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M6 17v-6M12 17V5M18 17v-9"/></svg>
        <span>Auswertung</span>
      </a>
    </nav>
    <button id="fab" type="button" aria-label="Neue Buchung">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <noscript>
    <p style="padding:24px">Diese App braucht JavaScript. Bitte im Browser aktivieren.</p>
  </noscript>
</body>
</html>
